name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      clean:
        description: Build without the compile cache
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONFORMANCE_COMMIT: 4f6c712ed8bc4f4f08c4a4a42bed1b52d8955d51

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-2022, experimental: false }
          - { name: linux-x64, os: ubuntu-22.04, experimental: false }
          - { name: macos-arm64, os: macos-14, experimental: false }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: build
        uses: ./.github/actions/build-hxc
        with:
          compile-cache: ${{ github.event_name != 'schedule' && inputs.clean != true }}

      - name: Smoke test
        shell: bash
        run: |
          exe="${{ steps.build.outputs.executable }}"
          hxc="$(cd "$(dirname "$exe")" && pwd)/$(basename "$exe")"
          "$hxc" -version
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          printf 'class Main {\n\tstatic function main() {\n\t\tvar m = [for (i in 0...3) i => i * i];\n\t\ttrace(m[2]);\n\t}\n}\n' > Main.hx
          "$hxc" -main Main --interp
          "$hxc" -main Main -js main.js
          node main.js

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: hxc-${{ matrix.name }}
          path: ${{ steps.build.outputs.executable }}
          if-no-files-found: error

  runs-haxe:
    name: Runs Haxe (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-2022, experimental: false, compare: "" }
          - { name: linux-x64, os: ubuntu-24.04, experimental: false, compare: "--haxe haxe" }
          - { name: macos-arm64, os: macos-14, experimental: false, compare: "--haxe haxe --divergences $GITHUB_WORKSPACE/tests/divergences-macos.json" }
    steps:
      - uses: actions/checkout@v4

      - id: t
        uses: ./.github/actions/setup-tests
        with:
          artifact: hxc-${{ matrix.name }}
          conformance-commit: ${{ env.CONFORMANCE_COMMIT }}

      - name: Parity with Haxe 4.3.7
        shell: bash
        run: |
          cd "${{ steps.t.outputs.conformance }}"
          neko run.n run --compiler "${{ steps.t.outputs.hxc }}" --std "$HAXE_STD_PATH" ${{ matrix.compare }} \
            --divergences "$GITHUB_WORKSPACE/tests/divergences.json" -j 4 \
            --junit "$RUNNER_TEMP/runs-haxe.xml" --title "Runs Haxe (${{ matrix.name }})"

      - name: hxc's own tests
        if: matrix.name == 'windows-x64'
        shell: bash
        run: |
          cd "${{ steps.t.outputs.conformance }}"
          neko run.n run --compiler "${{ steps.t.outputs.hxc }}" --std "$HAXE_STD_PATH" \
            --cases "$GITHUB_WORKSPACE/tests/cases" -j 4 --junit "$RUNNER_TEMP/hxc.xml" --title "hxc"

  jvm:
    name: JVM
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: t
        uses: ./.github/actions/setup-tests
        with:
          artifact: hxc-windows-x64
          conformance-commit: ${{ env.CONFORMANCE_COMMIT }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install utest
        shell: bash
        run: haxelib git utest https://github.com/haxe-utest/utest.git a94f8812e8786f2b5fec52ce9f26927591d26327 --always --quiet

      - name: Haxe's unit suite on the JVM
        shell: bash
        run: |
          cd "${{ steps.t.outputs.conformance }}/tests/unit"
          haxelib run hxjava native_java/hxjava_build.txt --out native_java/native
          rm -f bin/unit.jar && haxe compile-jvm-only.hxml && cp bin/unit.jar "$RUNNER_TEMP/haxe.jar"
          rm -f bin/unit.jar && "${{ steps.t.outputs.hxc }}" compile-jvm-only.hxml && cp bin/unit.jar "$RUNNER_TEMP/hxc.jar"
          python - "$RUNNER_TEMP/haxe.jar" "$RUNNER_TEMP/hxc.jar" <<'EOF'
          import sys, zipfile
          a, b = zipfile.ZipFile(sys.argv[1]), zipfile.ZipFile(sys.argv[2])
          na, nb = set(a.namelist()), set(b.namelist())
          # TestMain_Fields_ holds the time the suite was compiled.
          diff = sorted(n for n in na & nb if a.read(n) != b.read(n) and not n.endswith("TestMain_Fields_.class"))
          print("classes:", len(na), "missing:", sorted(na - nb)[:10], "extra:", sorted(nb - na)[:10], "different:", diff[:10])
          sys.exit(1 if na != nb or diff else 0)
          EOF
          cd bin && java -jar unit.jar | tee "$RUNNER_TEMP/jvm.log"
          grep -q "ALL TESTS OK" "$RUNNER_TEMP/jvm.log"

  haxe-suites:
    name: Haxe's suites
    needs: build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - id: t
        uses: ./.github/actions/setup-tests
        with:
          artifact: hxc-windows-x64
          conformance-commit: ${{ env.CONFORMANCE_COMMIT }}

      - name: Install utest
        shell: bash
        run: haxelib git utest https://github.com/haxe-utest/utest.git a94f8812e8786f2b5fec52ce9f26927591d26327 --always --quiet

      - name: unit and misc
        shell: bash
        run: |
          cd "${{ steps.t.outputs.conformance }}"
          neko run.n corpus unit,misc --compiler "${{ steps.t.outputs.hxc }}" --std "$HAXE_STD_PATH" --haxe haxe \
            --divergences "$GITHUB_WORKSPACE/tests/corpus-divergences.json" --junit "$RUNNER_TEMP/haxe-suites.xml"

  openfl:
    name: OpenFL
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: t
        uses: ./.github/actions/setup-tests
        with:
          artifact: hxc-windows-x64
          conformance-commit: ${{ env.CONFORMANCE_COMMIT }}

      - name: Install Lime and OpenFL
        shell: bash
        run: |
          haxelib install lime 8.3.2 --always --quiet
          haxelib install openfl 9.5.2 --always --quiet
          haxelib install openfl-samples 8.7.0 --always --quiet
          haxelib install actuate 1.9.0 --always --quiet

      - name: PiratePig typed by Haxe and by hxc
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          haxelib run openfl create PiratePig PiratePig
          cd PiratePig
          status=0
          for target in html5 windows; do
            haxelib run lime update $target
            haxe Export/$target/haxe/release.hxml --no-output > haxe-$target.txt 2>&1; echo "exit $?" >> haxe-$target.txt
            "${{ steps.t.outputs.hxc }}" Export/$target/haxe/release.hxml --no-output > hxc-$target.txt 2>&1; echo "exit $?" >> hxc-$target.txt
            if ! diff -u haxe-$target.txt hxc-$target.txt; then
              echo "::error::hxc types PiratePig for $target differently from Haxe"
              status=1
            fi
          done
          exit $status
