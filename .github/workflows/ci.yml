name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      clean:
        description: Build without the compile cache
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONFORMANCE_COMMIT: 1f8cdf63a3a09db7bc2cbd2547659dd7dc0c4cce

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-2022, experimental: false }
          - { name: linux-x64, os: ubuntu-22.04, experimental: false }
          - { name: macos-arm64, os: macos-15, experimental: false }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Generated sources are in step
        if: matrix.name == 'linux-x64'
        run: python3 tools/gen_processstate.py --check

      - id: build
        uses: ./.github/actions/build-hxc
        with:
          compile-cache: ${{ github.event_name != 'schedule' && inputs.clean != true }}

      - name: Smoke test
        shell: bash
        run: |
          exe="${{ steps.build.outputs.executable }}"
          hxc="$(cd "$(dirname "$exe")" && pwd)/$(basename "$exe")"
          "$hxc" -version
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          printf 'class Main {\n\tstatic function main() {\n\t\tvar m = [for (i in 0...3) i => i * i];\n\t\ttrace(m[2]);\n\t}\n}\n' > Main.hx
          "$hxc" -main Main --interp
          "$hxc" -main Main -js main.js
          node main.js

      - name: Upload the executable
        uses: actions/upload-artifact@v6
        with:
          name: hxc-${{ matrix.name }}
          path: ${{ steps.build.outputs.executable }}
          if-no-files-found: error

  runs-haxe:
    name: Runs Haxe (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-2022, experimental: false, compare: "" }
          - { name: linux-x64, os: ubuntu-24.04, experimental: false, compare: "--haxe haxe" }
          - { name: macos-arm64, os: macos-15, experimental: false, compare: "--haxe haxe --divergences $GITHUB_WORKSPACE/tests/divergences-macos.json" }
    steps:
      - uses: actions/checkout@v5

      - id: t
        uses: ./.github/actions/setup-tests
        with:
          artifact: hxc-${{ matrix.name }}
          conformance-commit: ${{ env.CONFORMANCE_COMMIT }}

      - name: Parity with Haxe 4.3.7
        shell: bash
        run: |
          cd "${{ steps.t.outputs.conformance }}"
          neko run.n run --compiler "${{ steps.t.outputs.hxc }}" --std "$HAXE_STD_PATH" ${{ matrix.compare }} \
            --divergences "$GITHUB_WORKSPACE/tests/divergences.json" -j 4 \
            --junit "$RUNNER_TEMP/runs-haxe.xml" --title "Runs Haxe (${{ matrix.name }})"

      - name: hxc's own tests
        if: matrix.name == 'windows-x64'
        shell: bash
        run: |
          cd "${{ steps.t.outputs.conformance }}"
          neko run.n run --compiler "${{ steps.t.outputs.hxc }}" --std "$HAXE_STD_PATH" \
            --cases "$GITHUB_WORKSPACE/tests/cases" --expected "$GITHUB_WORKSPACE/tests/expected" \
            --divergences "$GITHUB_WORKSPACE/tests/divergences.json" \
            -j 4 --junit "$RUNNER_TEMP/hxc.xml" --title "hxc"

  jvm:
    name: JVM
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - id: t
        uses: ./.github/actions/setup-tests
        with:
          artifact: hxc-windows-x64
          conformance-commit: ${{ env.CONFORMANCE_COMMIT }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install utest
        shell: bash
        run: haxelib git utest https://github.com/haxe-utest/utest.git a94f8812e8786f2b5fec52ce9f26927591d26327 --always --quiet

      - name: Haxe's unit suite on the JVM
        shell: bash
        run: |
          cd "${{ steps.t.outputs.conformance }}/tests/unit"
          haxelib run hxjava native_java/hxjava_build.txt --out native_java/native
          rm -f bin/unit.jar && haxe compile-jvm-only.hxml && cp bin/unit.jar "$RUNNER_TEMP/haxe.jar"
          rm -f bin/unit.jar && "${{ steps.t.outputs.hxc }}" compile-jvm-only.hxml && cp bin/unit.jar "$RUNNER_TEMP/hxc.jar"
          python - "$RUNNER_TEMP/haxe.jar" "$RUNNER_TEMP/hxc.jar" <<'EOF'
          import sys, zipfile
          a, b = zipfile.ZipFile(sys.argv[1]), zipfile.ZipFile(sys.argv[2])
          na, nb = set(a.namelist()), set(b.namelist())
          # TestMain_Fields_ holds the time the suite was compiled.
          diff = sorted(n for n in na & nb if a.read(n) != b.read(n) and not n.endswith("TestMain_Fields_.class"))
          print("classes:", len(na), "missing:", sorted(na - nb)[:10], "extra:", sorted(nb - na)[:10], "different:", diff[:10])
          sys.exit(1 if na != nb or diff else 0)
          EOF
          cd bin && java -jar unit.jar | tee "$RUNNER_TEMP/jvm.log"
          grep -q "ALL TESTS OK" "$RUNNER_TEMP/jvm.log"

  dotnet:
    name: .NET
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - id: t
        uses: ./.github/actions/setup-tests
        with:
          artifact: hxc-windows-x64
          conformance-commit: ${{ env.CONFORMANCE_COMMIT }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: The .NET generator's cases
        shell: bash
        run: tests/dotnet/run.sh --compiler "${{ steps.t.outputs.hxc }}" --std "$HAXE_STD_PATH"

      # In a folder with its own empty haxelib repository, haxelib finds no hxcs, so hxc uses the net-20
      # reference assemblies it carries; the .dll must be the one built with the global hxcs.
      - name: Builds without hxcs, to the same bytes
        shell: bash
        run: |
          hxc="${{ steps.t.outputs.hxc }}"
          printf 'class Main {\n\tstatic function main() {\n\t\tvar m = [1 => "a"];\n\t\ttrace(m.get(1) + cs.system.Environment.Version.Major);\n\t}\n}\n' > "$RUNNER_TEMP/Main.hx"
          for d in with without; do mkdir -p "$RUNNER_TEMP/$d" && cp "$RUNNER_TEMP/Main.hx" "$RUNNER_TEMP/$d/"; done
          (cd "$RUNNER_TEMP/without" && haxelib newrepo && ! haxelib path hxcs > /dev/null 2>&1)
          (cd "$RUNNER_TEMP/with" && "$hxc" -main Main --dotnet out)
          (cd "$RUNNER_TEMP/without" && "$hxc" -main Main --dotnet out)
          cmp "$RUNNER_TEMP/with/out/out.dll" "$RUNNER_TEMP/without/out/out.dll"
          dotnet "$RUNNER_TEMP/without/out/out.dll"

  dotnet-host:
    name: hxc on .NET
    needs: build
    runs-on: windows-2022
    # New: it reports without failing the run until it has been green for a while.
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - id: t
        uses: ./.github/actions/setup-tests
        with:
          artifact: hxc-windows-x64
          conformance-commit: ${{ env.CONFORMANCE_COMMIT }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # The same hxcpp commit the build-hxc action pins: only its PCRE2 sources are used here.
      - name: Fetch hxcpp for the PCRE2 sources
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hxcpp-src" && cd "$RUNNER_TEMP/hxcpp-src"
          git init -q && git remote add origin https://github.com/openfl/libhxcpp.git
          git fetch -q --depth 1 origin 1d90a2a86facf23ee3f9cee3abf33c704338988b && git checkout -q FETCH_HEAD
          echo "HXCPP=$(cygpath -m "$RUNNER_TEMP/hxcpp-src")" >> "$GITHUB_ENV"

      - name: Build hxc for .NET
        shell: bash
        run: tools/dotnet-host/build.sh "${{ steps.t.outputs.hxc }}" "$RUNNER_TEMP/hxc-dotnet"

      - name: It builds itself to the same bytes
        shell: bash
        run: |
          tools/dotnet-host/build.sh "$RUNNER_TEMP/hxc-dotnet/hxc.exe" "$RUNNER_TEMP/hxc-dotnet-2"
          cmp "$RUNNER_TEMP/hxc-dotnet/hxc.dll" "$RUNNER_TEMP/hxc-dotnet-2/hxc.dll"

      - name: Smoke test
        shell: bash
        run: |
          hxc="$RUNNER_TEMP/hxc-dotnet/hxc.exe"
          "$hxc" -version
          mkdir -p "$RUNNER_TEMP/smoke-dotnet" && cd "$RUNNER_TEMP/smoke-dotnet"
          printf 'class Main {\n\tstatic function main() {\n\t\tvar m = [for (i in 0...3) i => i * i];\n\t\ttrace(m[2]);\n\t}\n}\n' > Main.hx
          "$hxc" -main Main --interp
          "$hxc" -main Main -js main.js
          node main.js

      - name: Parity with Haxe 4.3.7
        shell: bash
        run: |
          cd "${{ steps.t.outputs.conformance }}"
          neko run.n run --compiler "$(cygpath -m "$RUNNER_TEMP/hxc-dotnet/hxc.exe")" --std "$HAXE_STD_PATH" \
            --divergences "$GITHUB_WORKSPACE/tests/divergences.json" \
            --divergences "$GITHUB_WORKSPACE/tests/divergences-dotnet-host.json" -j 4 \
            --junit "$RUNNER_TEMP/dotnet-host.xml" --title "hxc on .NET"

      - name: hxc's own tests
        shell: bash
        run: |
          cd "${{ steps.t.outputs.conformance }}"
          neko run.n run --compiler "$(cygpath -m "$RUNNER_TEMP/hxc-dotnet/hxc.exe")" --std "$HAXE_STD_PATH" \
            --cases "$GITHUB_WORKSPACE/tests/cases" --expected "$GITHUB_WORKSPACE/tests/expected" \
            --divergences "$GITHUB_WORKSPACE/tests/divergences.json" \
            --divergences "$GITHUB_WORKSPACE/tests/divergences-dotnet-host.json" \
            -j 4 --junit "$RUNNER_TEMP/dotnet-host-own.xml" --title "hxc on .NET, own tests"

      - name: Upload the .NET build
        uses: actions/upload-artifact@v6
        with:
          name: hxc-dotnet-windows-x64
          path: |
            ${{ runner.temp }}/hxc-dotnet/hxc.exe
            ${{ runner.temp }}/hxc-dotnet/hxc.dll
            ${{ runner.temp }}/hxc-dotnet/hxc.runtimeconfig.json
            ${{ runner.temp }}/hxc-dotnet/HxcHostNative.dll
            ${{ runner.temp }}/hxc-dotnet/pcre2-8.dll
            ${{ runner.temp }}/hxc-dotnet/hxczlib.dll
          if-no-files-found: error

  haxe-suites:
    name: Haxe's suites
    needs: build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - id: t
        uses: ./.github/actions/setup-tests
        with:
          artifact: hxc-windows-x64
          conformance-commit: ${{ env.CONFORMANCE_COMMIT }}

      - name: Install utest
        shell: bash
        run: haxelib git utest https://github.com/haxe-utest/utest.git a94f8812e8786f2b5fec52ce9f26927591d26327 --always --quiet

      - name: unit and misc
        shell: bash
        run: |
          cd "${{ steps.t.outputs.conformance }}"
          neko run.n corpus unit,misc --compiler "${{ steps.t.outputs.hxc }}" --std "$HAXE_STD_PATH" --haxe haxe \
            --divergences "$GITHUB_WORKSPACE/tests/corpus-divergences.json" --junit "$RUNNER_TEMP/haxe-suites.xml"

  openfl:
    name: OpenFL
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - id: t
        uses: ./.github/actions/setup-tests
        with:
          artifact: hxc-windows-x64
          conformance-commit: ${{ env.CONFORMANCE_COMMIT }}

      - name: Install Lime and OpenFL
        shell: bash
        run: |
          haxelib install lime 8.3.2 --always --quiet
          haxelib install openfl 9.5.2 --always --quiet
          haxelib install openfl-samples 8.7.0 --always --quiet
          haxelib install actuate 1.9.0 --always --quiet

      - name: PiratePig typed by Haxe and by hxc
        shell: bash
        run: |
          repo="$(haxelib config | tr -d '\r')"
          echo "haxelib repository: $repo"
          cp -r "${repo%/}/openfl-samples/8,7,0/demos/PiratePig" "$RUNNER_TEMP/PiratePig"
          cd "$RUNNER_TEMP/PiratePig"
          status=0
          for target in html5 windows; do
            haxelib run lime update $target || { echo "::error::lime update $target failed"; exit 1; }
            code=0; haxe Export/$target/haxe/release.hxml --no-output > haxe-$target.txt 2>&1 || code=$?
            echo "exit $code" >> haxe-$target.txt
            code=0; "${{ steps.t.outputs.hxc }}" Export/$target/haxe/release.hxml --no-output > hxc-$target.txt 2>&1 || code=$?
            echo "exit $code" >> hxc-$target.txt
            if ! diff -u haxe-$target.txt hxc-$target.txt; then
              echo "::error::hxc types PiratePig for $target differently from Haxe"
              status=1
            fi
          done
          exit $status
