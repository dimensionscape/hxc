name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: windows-x64, os: windows-2022, asset: hxc-windows-x64.exe }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: build
        uses: ./.github/actions/build-hxc
        with:
          compile-cache: "false"

      - name: Smoke test
        shell: bash
        run: |
          "${{ steps.build.outputs.executable }}" -version

      - name: Stage the asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ steps.build.outputs.executable }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release and attach the executables
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes "" --repo "$GITHUB_REPOSITORY"
          fi
