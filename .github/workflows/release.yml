name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: windows-x64, os: windows-2022, asset: hxc-windows-x64.exe }
          # The oldest supported image, so the binary runs on systems with an older glibc.
          - { name: linux-x64, os: ubuntu-22.04, asset: hxc-linux-x64 }
          - { name: macos-arm64, os: macos-14, asset: hxc-macos-arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: build
        uses: ./.github/actions/build-hxc
        with:
          compile-cache: "false"

      - name: Smoke test
        shell: bash
        run: |
          "${{ steps.build.outputs.executable }}" -version

      - name: Stage the asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ steps.build.outputs.executable }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  package:
    name: Package for haxelib
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Zip the haxelib package
        run: |
          mkdir -p dist
          zip -qr dist/hxc-haxelib.zip haxelib.json Run.hx README.md LICENSE Aedifex.hx src \
            thirdparty/libuv/include thirdparty/libuv/src thirdparty/libuv/LICENSE thirdparty/libuv/LICENSE-extra

      - uses: actions/upload-artifact@v4
        with:
          name: hxc-haxelib
          path: dist/
          if-no-files-found: ignore

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release and attach the executables
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes "" --repo "$GITHUB_REPOSITORY"
          fi
