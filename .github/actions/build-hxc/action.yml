name: Build hxc
description: Installs the pinned toolchain and builds the hxc executable.

inputs:
  compile-cache:
    description: Reuse hxcpp's content-addressed compile cache across runs.
    default: "true"
  self-host:
    description: Rebuild hxc with the hxc just built, and compare the C++ both generate.
    default: "true"
  haxe-version:
    default: "4.3.7"
  hxcpp-repo:
    default: https://github.com/dimensionscape/hxcpp.git
  hxcpp-commit:
    default: 8399945561eeffebb727aa35b02d939e06c07e58
  aedifex-repo:
    default: https://github.com/DimensionscapeOrg/aedifex.git
  aedifex-commit:
    default: 41604cd3e9cc3930473f6015608643a2fbb9ec56

outputs:
  executable:
    description: Path of the built executable.
    value: ${{ steps.locate.outputs.executable }}

runs:
  using: composite
  steps:
    - if: runner.os != 'macOS'
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: ${{ inputs.haxe-version }}

    - name: Install Haxe from Homebrew
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install haxe neko
        mkdir -p "$HOME/haxelib" && haxelib setup "$HOME/haxelib"
        version=$(haxe -version 2>&1)
        echo "haxe $version"
        case "$version" in
          "${{ inputs.haxe-version }}"*) ;;
          4.3.*) echo "::warning::Homebrew has Haxe $version, not ${{ inputs.haxe-version }}" ;;
          *) echo "::error::Homebrew has Haxe $version"; exit 1 ;;
        esac
        echo "HAXE_STD_PATH=$(brew --prefix haxe)/lib/haxe/std" >> "$GITHUB_ENV"

    - name: Restore hxcpp and aedifex
      id: tools-cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/hxcpp
          ${{ runner.temp }}/aedifex
        key: tools-${{ runner.os }}-${{ inputs.hxcpp-commit }}-${{ inputs.aedifex-commit }}

    - name: Fetch hxcpp and aedifex
      if: steps.tools-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        fetch() {
          mkdir -p "$3" && cd "$3"
          git init -q && git remote add origin "$1"
          git fetch -q --depth 1 origin "$2" && git checkout -q FETCH_HEAD
        }
        fetch "${{ inputs.hxcpp-repo }}" "${{ inputs.hxcpp-commit }}" "$RUNNER_TEMP/hxcpp"
        fetch "${{ inputs.aedifex-repo }}" "${{ inputs.aedifex-commit }}" "$RUNNER_TEMP/aedifex"
        cd "$RUNNER_TEMP/hxcpp/tools/hxcpp" && haxe compile.hxml

    - name: Register hxcpp and aedifex
      shell: bash
      run: |
        haxelib dev hxcpp "$RUNNER_TEMP/hxcpp"
        haxelib dev aedifex "$RUNNER_TEMP/aedifex"

    - name: Restore the compile cache
      if: inputs.compile-cache == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/hxcpp-cache
        key: hxcpp-cache-${{ runner.os }}-${{ inputs.hxcpp-commit }}-${{ github.sha }}
        restore-keys: hxcpp-cache-${{ runner.os }}-${{ inputs.hxcpp-commit }}-

    - name: Configure the build
      shell: bash
      run: |
        # Both stages must see the same spelling of the path: it is written into the generated C++.
        if [ -z "${HAXE_STD_PATH:-}" ]; then
          std="$(dirname "$(command -v haxe)")/std"
          [ "$RUNNER_OS" = "Windows" ] && std="$(cygpath -m "$std")"
          echo "HAXE_STD_PATH=$std" >> "$GITHUB_ENV"
        fi
        # Without a cache from earlier runs, the job still gets one of its own, so the second stage
        # reuses the first stage's objects.
        if [ "${{ inputs.compile-cache }}" = "true" ]; then
          echo "HXCPP_COMPILE_CACHE=$RUNNER_TEMP/hxcpp-cache" >> "$GITHUB_ENV"
        else
          echo "HXCPP_COMPILE_CACHE=$RUNNER_TEMP/hxcpp-job-cache" >> "$GITHUB_ENV"
        fi
        # Aedifex names the output directory after the architecture, which it does not detect on macOS.
        if [ "$(uname -m)" = "arm64" ]; then echo "AEDIFEX_ARCH=-arm64" >> "$GITHUB_ENV"; fi

    - name: Build with Haxe
      shell: bash
      run: |
        mkdir -p "$HXCPP_COMPILE_CACHE"
        echo "HAXE_STD_PATH=$HAXE_STD_PATH"
        haxelib run aedifex build cpp . ${AEDIFEX_ARCH:-}

    - name: Locate the executable
      id: locate
      shell: bash
      run: |
        exe=$(find bin/cpp -path '*/release/bin/hxc' -o -path '*/release/bin/hxc.exe' | head -1)
        [ -n "$exe" ] || { echo "no executable under bin/cpp" >&2; exit 1; }
        echo "executable=$exe" >> "$GITHUB_OUTPUT"
        echo "generated=$(dirname "$(dirname "$exe")")/obj" >> "$GITHUB_OUTPUT"

    - name: Build with hxc
      if: inputs.self-host == 'true'
      shell: bash
      run: |
        exe="${{ steps.locate.outputs.executable }}"
        gen="${{ steps.locate.outputs.generated }}"
        stage1="$RUNNER_TEMP/hxc-stage1${exe##*/hxc}"
        [ "$RUNNER_OS" = "Windows" ] && stage1="$(cygpath -m "$stage1")"
        cp "$exe" "$stage1"
        rm -rf "$RUNNER_TEMP/stage1-gen" && mkdir -p "$RUNNER_TEMP/stage1-gen"
        cp -r "$gen/src" "$gen/include" "$RUNNER_TEMP/stage1-gen/"
        # Removed so the second stage has to generate every file itself.
        rm -rf "$gen/src" "$gen/include"
        AEDIFEX_HAXE="$stage1" haxelib run aedifex build cpp . ${AEDIFEX_ARCH:-}
        [ -d "$gen/src" ] || { echo "::error::the second stage generated no C++"; exit 1; }
        # hxc must generate from its own source the C++ that Haxe generated. One file may differ:
        # EvalStdLib.cpp, where two internal counters can be numbered one apart.
        diff -rq "$RUNNER_TEMP/stage1-gen/src" "$gen/src" > "$RUNNER_TEMP/selfhost.diff" || true
        diff -rq "$RUNNER_TEMP/stage1-gen/include" "$gen/include" >> "$RUNNER_TEMP/selfhost.diff" || true
        grep -v "EvalStdLib.cpp" "$RUNNER_TEMP/selfhost.diff" > "$RUNNER_TEMP/selfhost.unexpected" || true
        echo "generated C++ files that differ: $(wc -l < "$RUNNER_TEMP/selfhost.diff")"
        if [ -s "$RUNNER_TEMP/selfhost.unexpected" ]; then
          echo "::error::hxc generated different C++ for its own source than Haxe did"
          head -20 "$RUNNER_TEMP/selfhost.unexpected"
          exit 1
        fi
